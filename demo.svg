<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460" role="img" aria-labelledby="t d"><title id="t">GameGuard AI synthetic demonstration</title><desc id="d">Two synthetic player profiles: human demo monitor score zero and scripted demo review score 45. Not a real-world accuracy result.</desc><rect width="880" height="460" rx="18" fill="#101722"/><text x="38" y="58" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#8ce4d2">GameGuard AI</text><text x="38" y="88" font-family="Arial,sans-serif" font-size="16" fill="#b9cada">Synthetic review example · 360 decisions · 2 profiles</text><rect x="38" y="116" width="804" height="128" rx="12" fill="#1c2938" stroke="#34465b"/><text x="60" y="151" font-family="Arial,sans-serif" font-size="21" fill="white">human_demo</text><text x="60" y="183" font-family="Arial,sans-serif" font-size="16" fill="#b9cada">180 decisions · 0 signals</text><text x="60" y="215" font-family="Arial,sans-serif" font-size="15" fill="#8ce4d2">MONITOR</text><text x="744" y="188" font-family="Arial,sans-serif" font-size="28" fill="white">0/100</text><rect x="38" y="262" width="804" height="128" rx="12" fill="#1c2938" stroke="#34465b"/><text x="60" y="297" font-family="Arial,sans-serif" font-size="21" fill="white">scripted_demo</text><text x="60" y="328" font-family="Arial,sans-serif" font-size="16" fill="#b9cada">180 decisions · low timing variation · repeated-spot consistency</text><text x="60" y="360" font-family="Arial,sans-serif" font-size="15" fill="#ffbd78">REVIEW BY ANALYST</text><text x="720" y="334" font-family="Arial,sans-serif" font-size="28" fill="white">45/100</text><text x="38" y="430" font-family="Arial,sans-serif" font-size="15" fill="#b9cada">Scores are review priorities, not AI-use probabilities. Synthetic fixture; no real-world validation.</text></svg>
